<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashpoint Pyro Admin</title><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0a7cff">
<link rel="stylesheet" href="style.css"><script src="config.js"></script>
</head><body>
<div class="wrap">
<section id="list" class="admin-list">
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><h1>My items</h1></div>
  <div class="stats"><div><b id="n1">0</b><span>Available</span></div><div><b id="n2">0</b><span>Sold out</span></div></div>
  <div id="items"></div>
  <button class="btn pri fab" id="add">Add item</button>
</section>

<section id="form" class="panel hide">
  <h1 id="ftitle">Add item</h1>
  <label>Photo</label>
  <img id="prev" class="ph hide" alt="" style="max-width:220px;border-radius:12px;margin-bottom:8px">
  <input id="file" type="file" accept="image/*">
  <label for="nm">Name</label><input id="nm" maxlength="80">
  <label for="pr">Price (₱)</label><input id="pr" type="number" inputmode="decimal" min="0" step="any">
  <label for="ct">Category</label><input id="ct" type="text" maxlength="50">
  <label for="ds">Description</label><textarea id="ds" rows="3" maxlength="400"></textarea>
  <label class="row" style="color:var(--ink)"><input id="so" type="checkbox" style="width:auto"> Sold out</label>
  <div class="msg" id="fmsg"></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="cancel" style="flex:1">Cancel</button><button class="btn pri" id="save" style="flex:1">Save</button></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const C=window.CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items=[],editing=null,blob=null;
const show=n=>["list","form"].forEach(s=>$(s).classList.toggle("hide",s!==n));

async function load(){
  const{data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});
  if(error){alert("Couldn't load items. Check your connection.");return}
  items=data;
  $("n1").textContent=items.filter(i=>!i.sold_out).length;$("n2").textContent=items.filter(i=>i.sold_out).length;
  $("items").innerHTML=items.length?items.map(i=>`<div class="item">
    ${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:`<div class="ph"></div>`}
    <div class="info"><div><b>${esc(i.name)}</b></div><div>₱${Number(i.price).toLocaleString()}${i.sold_out?" · Sold out":""}</div></div>
    <div class="acts"><button class="btn sm" data-a="sold" data-id="${i.id}">${i.sold_out?"Restock":"Sold out"}</button>
    <button class="btn sm" data-a="edit" data-id="${i.id}">Edit</button>
    <button class="btn sm dng" data-a="del" data-id="${i.id}">Delete</button></div></div>`).join(""):`<p class="empty">No items yet. Tap Add item to post your first one.</p>`;
  show("list");
}
$("items").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const i=items.find(x=>x.id===b.dataset.id);
  if(b.dataset.a==="sold"){await sb.from("products").update({sold_out:!i.sold_out}).eq("id",i.id);load()}
  if(b.dataset.a==="del"&&confirm(`Delete "${i.name}"?`)){await sb.from("products").delete().eq("id",i.id);load()}
  if(b.dataset.a==="edit")openForm(i);
};
$("add").onclick=()=>openForm(null);
$("cancel").onclick=()=>show("list");
function openForm(i){
  editing=i;blob=null;$("file").value="";$("fmsg").textContent="";
  $("ftitle").textContent=i?"Edit item":"Add item";
  $("nm").value=i?.name||"";$("pr").value=i?.price??"";$("ds").value=i?.description||"";
  $("ct").value=i?.category||"";$("so").checked=!!i?.sold_out;
  $("prev").src=i?.image_url||"";$("prev").classList.toggle("hide",!i?.image_url);
  show("form");
}
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const img=await createImageBitmap(f),s=Math.min(1,1000/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
  $("prev").src=URL.createObjectURL(blob);$("prev").classList.remove("hide");
};
$("save").onclick=async()=>{
  const name=$("nm").value.trim(),price=parseFloat($("pr").value);
  if(!name){$("fmsg").textContent="Enter a name for the item.";return}
  if(isNaN(price)||price<0){$("fmsg").textContent="Enter a valid price.";return}
  $("save").textContent="Saving…";$("fmsg").textContent="";
  try{
    let image_url=editing?.image_url||null;
    if(blob){
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});
      if(up.error)throw up.error;
      image_url=sb.storage.from("products").getPublicUrl(path).data.publicUrl;
    }
    const row={name,price,description:$("ds").value.trim(),category:$("ct").value,sold_out:$("so").checked,image_url};
    const r=editing?await sb.from("products").update(row).eq("id",editing.id):await sb.from("products").insert(row);
    if(r.error)throw r.error;
    load();
  }catch(err){$("fmsg").textContent="Couldn't save. Check your connection and try again."}
  $("save").textContent="Save";
};
load();
</script></body></html>
