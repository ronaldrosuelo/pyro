<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0b1026">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chat.css"><script src="config.js"></script>
<style>.hero.sm{padding:calc(env(safe-area-inset-top) + 22px) 16px 18px}.hero.sm h1{font-size:clamp(1.5rem,5vw,2.2rem)}.tbar{max-width:760px;margin:0 auto 10px}.thread .chat-form{border-top:1px solid var(--line)}</style>
</head><body>
<header class="hero sm"><span class="eyebrow">Messages</span><h1>Flashpoint Pyro</h1></header>
<div class="wrap">
<section id="login" class="panel hide">
  <h1 style="font-size:1.4rem">Admin login</h1>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <div class="msg" id="lmsg"></div>
  <button class="btn pri" id="lbtn" style="width:100%">Log in</button>
</section>

<section id="inbox" class="admin-list hide">
  <div class="row" style="justify-content:space-between;margin-bottom:12px"><a class="btn sm" href="admin.html">Items</a><button class="btn sm" id="out">Log out</button></div>
  <div id="convos"></div>
</section>

<section id="thread" class="hide">
  <div class="tbar row" style="justify-content:space-between"><button class="btn sm" id="back">← Back</button><b id="tname"></b><span></span></div>
  <div class="thread"><div class="chat-msgs" id="tmsgs"></div>
  <form class="chat-form" id="tform"><input id="ttext" maxlength="1000" placeholder="Type a reply" autocomplete="off"><button class="btn pri" type="submit">Send</button></form></div>
</section>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const C=window.CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when=d=>new Date(d).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

let convos=[],active=null,msgs=[];

const show=n=>["login","inbox","thread"].forEach(s=>$(s).classList.toggle("hide",s!==n));

async function boot(){const{data:{session}}=await sb.auth.getSession();session?.user?.email?start():show("login")}

$("lbtn").onclick=async()=>{

  $("lmsg").textContent="";

  const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});

  if(error)$("lmsg").textContent="Wrong email or password. Try again.";else start();

};

$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};

async function loadConvos(){

  const{data,error}=await sb.from("conversations").select("*").order("last_at",{ascending:false});

  if(error)return;convos=data;

  $("convos").innerHTML=convos.length?convos.map(c=>`<button class="convo" data-id="${c.id}">
    <div class="info"><div><b>${esc(c.name||"Guest")}</b></div><div>${esc(c.last_text)}</div><small>${when(c.last_at)}</small></div>${c.unread?`<span class="dot" aria-label="Unread"></span>`:""}</button>`).join(""):`<p class="empty">No chats yet. Messages from buyers will show up here.</p>`;

}

$("convos").onclick=async e=>{

  const b=e.target.closest(".convo");if(!b)return;

  active=convos.find(c=>c.id===b.dataset.id);$("tname").textContent=active.name||"Guest";

  const{data}=await sb.from("messages").select("*").eq("convo_id",active.id).order("created_at");

  msgs=data||[];drawT();show("thread");

  sb.from("conversations").update({unread:false}).eq("id",active.id);

};

function drawT(){

  $("tmsgs").innerHTML=msgs.map(m=>`<div class="m ${m.sender==="admin"?"me":"them"}">${esc(m.body)}<time>${when(m.created_at)}</time></div>`).join("");

  $("tmsgs").scrollTop=$("tmsgs").scrollHeight;

}

$("back").onclick=()=>{active=null;show("inbox");loadConvos()};

$("tform").onsubmit=async e=>{

  e.preventDefault();const body=$("ttext").value.trim();if(!body||!active)return;

  $("ttext").value="";

  const m={id:crypto.randomUUID(),convo_id:active.id,sender:"admin",body,created_at:new Date().toISOString()};

  msgs.push(m);drawT();

  const r=await sb.from("messages").insert({id:m.id,convo_id:active.id,sender:"admin",body});

  if(r.error){msgs=msgs.filter(x=>x.id!==m.id);drawT();$("ttext").value=body;alert("Couldn't send. Check your connection.");return}

  sb.from("conversations").update({last_text:"You: "+body.slice(0,70),last_at:m.created_at,unread:false}).eq("id",active.id);

};

function start(){

  loadConvos();show("inbox");

  sb.channel("inbox")
   .on("postgres_changes",{event:"*",schema:"public",table:"conversations"},()=>{if(!active)loadConvos()})
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{
     const m=p.new;
     if(active&&m.convo_id===active.id&&!msgs.some(x=>x.id===m.id)){msgs.push(m);drawT();sb.from("conversations").update({unread:false}).eq("id",active.id)}
   }).subscribe();

}

boot();
</script></body></html>
