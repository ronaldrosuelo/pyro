<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashpoint Pyro Admin</title><meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1026">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chat.css"><script src="config.js"></script>
<style>
.hero.sm{padding:calc(env(safe-area-inset-top) + 22px) 16px 18px}
.hero.sm h1{font-size:clamp(1.5rem,5vw,2.2rem)}
.item{flex-wrap:wrap;border-radius:16px;padding:12px}
.item img,.item .ph{width:64px;height:64px;border-radius:10px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;margin-left:6px;vertical-align:1px}
.pill.ok{background:rgba(76,198,138,.15);color:var(--ok)}.pill.no{background:rgba(255,122,138,.15);color:var(--danger)}
.price-s{color:var(--accent);font-weight:700}
.acts{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fabbar{position:sticky;bottom:0;margin:0 -14px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(11,16,38,0),var(--bg) 40%)}
.fabbar .btn{width:100%;min-height:50px;font-size:17px}
#prev{width:100%;max-width:240px;aspect-ratio:1;object-fit:cover;border-radius:14px;margin-bottom:10px;display:block}
input[type=file]{padding:10px;background:#0f1530}
.toggle{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:16px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.panel{margin-top:4px}
@media(min-width:600px){.item{flex-wrap:nowrap}.acts{width:auto;display:flex}}
</style>
</head><body>
<header class="hero sm">
  <span class="eyebrow">Admin</span>
  <div class="row" style="justify-content:space-between">
    <h1>Flashpoint Pyro</h1>
    <a class="btn sm" href="messages.html">Messages</a>
  </div>
</header>
<div class="wrap">
<section id="list" class="admin-list">
  <div class="stats"><div><b id="n1">0</b><span>Available</span></div><div><b id="n2">0</b><span>Sold out</span></div></div>
  <div id="items"></div>
  <div class="fabbar"><button class="btn pri" id="add">Add item</button></div>
</section>

<section id="form" class="panel hide">
  <h1 id="ftitle" style="font-size:1.4rem">Add item</h1>
  <label for="file">Photo</label>
  <img id="prev" class="hide" alt="Preview">
  <input id="file" type="file" accept="image/*">
  <label for="nm">Name</label><input id="nm" maxlength="80">
  <label for="pr">Price (₱)</label><input id="pr" type="number" inputmode="decimal" min="0" step="any">
  <label for="ct">Category</label><input id="ct" type="text" maxlength="50" list="cats" autocomplete="off"><datalist id="cats"></datalist>
  <label for="ds">Description</label><textarea id="ds" rows="3" maxlength="400"></textarea>
  <label class="toggle"><input id="so" type="checkbox"> Mark as sold out</label>
  <div class="msg" id="fmsg"></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="cancel" style="flex:1">Cancel</button><button class="btn pri" id="save" style="flex:1">Save</button></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const C=window.CONFIG,sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items=[],editing=null,blob=null;
const show=n=>{["list","form"].forEach(s=>$(s).classList.toggle("hide",s!==n));window.scrollTo(0,0)};

async function load(){
  const{data,error}=await sb.from("products").select("*").order("created_at",{ascending:false});
  if(error){alert("Couldn't load items. Check your connection.");return}
  items=data;
  $("n1").textContent=items.filter(i=>!i.sold_out).length;$("n2").textContent=items.filter(i=>i.sold_out).length;
  $("cats").innerHTML=[...new Set(items.map(i=>i.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  $("items").innerHTML=items.length?items.map(i=>`<div class="item">
    ${i.image_url?`<img src="${esc(i.image_url)}" alt="">`:`<div class="ph"></div>`}
    <div class="info"><div><b>${esc(i.name)}</b></div>
      <div><span class="price-s">₱${Number(i.price).toLocaleString()}</span><span class="pill ${i.sold_out?"no":"ok"}">${i.sold_out?"Sold out":"Available"}</span></div></div>
    <div class="acts"><button class="btn sm" data-a="sold" data-id="${i.id}">${i.sold_out?"Restock":"Sold out"}</button>
    <button class="btn sm" data-a="edit" data-id="${i.id}">Edit</button>
    <button class="btn sm dng" data-a="del" data-id="${i.id}">Delete</button></div></div>`).join(""):`<p class="empty">No items yet. Tap Add item to post your first one.</p>`;
  show("list");
}
$("items").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  const i=items.find(x=>x.id===b.dataset.id);
  if(b.dataset.a==="sold"){await sb.from("products").update({sold_out:!i.sold_out}).eq("id",i.id);load()}
  if(b.dataset.a==="del"&&confirm(`Delete "${i.name}"?`)){await sb.from("products").delete().eq("id",i.id);load()}
  if(b.dataset.a==="edit")openForm(i);
};
$("add").onclick=()=>openForm(null);
$("cancel").onclick=()=>show("list");
function openForm(i){
  editing=i;blob=null;$("file").value="";$("fmsg").textContent="";
  $("ftitle").textContent=i?"Edit item":"Add item";
  $("nm").value=i?.name||"";$("pr").value=i?.price??"";$("ds").value=i?.description||"";
  $("ct").value=i?.category||"";$("so").checked=!!i?.sold_out;
  $("prev").src=i?.image_url||"";$("prev").classList.toggle("hide",!i?.image_url);
  show("form");
}
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const img=await createImageBitmap(f),s=Math.min(1,1000/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
  $("prev").src=URL.createObjectURL(blob);$("prev").classList.orgList?.remove("hide");
};
$("save").onclick=async()=>{
  const name=$("nm").value.trim(),price=parseFloat($("pr").value);
  if(!name){$("fmsg").textContent="Enter a name for the item.";return}
  if(isNaN(price)||price<0){$("fmsg").textContent="Enter a valid price.";return}
  $("save").textContent="Saving…";$("fmsg").textContent="";
  try{
    let image_url=editing?.image_url||null;
    if(blob){
      const path=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up=await sb.storage.from("products").upload(path,blob,{contentType:"image/jpeg"});
      if(up.error)throw up.error;
      image_url=sb.storage.from("products").getPublicUrl(path).data.publicUrl;
    }
    const row={name,price,description:$("ds").value.trim(),category:$("ct").value.trim(),sold_out:$("so").checked,image_url};
    const r=editing?await sb.from("products").update(row).eq("id",editing.id):await sb.from("products").insert(row);
    if(r.error)throw r.error;
    load();
  }catch(err){$("fmsg").textContent="Error: "+(err.message||JSON.stringify(err));}
  $("save").textContent="Save";
};
load();
</script></body></html>
